name: CI
on:
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        runs-on: [ubuntu-latest]
    runs-on: ${{ matrix.runs-on }}
    steps:
      - name: poison artifact
        run: |
          mkdir -p test-results
          printf '%s\n' 'x"; echo GHA_POC_SANLING1; echo "x' > test-results/sha-number
          printf '%s\n' '<testsuite name="x" tests="0"></testsuite>' > test-results/junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.runs-on }}
          path: test-results/
